name: Sync vids.st pendientes

on:
  push:
    paths:
      - 'pendientes.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver el link nuevo en vidsst-scraper
        run: curl -sf "https://vids-scrapp.onrender.com/sync?secret=${{ secrets.RESOLVE_SECRET }}"

      - name: Avisarle al addon en Oracle que hay links nuevos
        run: curl -sf "https://addonlatam.duckdns.org/admin/refresh-vids-manual?secret=${{ secrets.M3U_REFRESH_SECRET }}"
