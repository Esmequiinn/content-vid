name: Sync internet-archive.json

on:
  push:
    paths:
      - 'internet-archive.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Avisarle al addon
        run: curl -sf "https://addon-lat.onrender.com/admin/refresh-internet-archive?secret=${{ secrets.M3U_REFRESH_SECRET }}"
